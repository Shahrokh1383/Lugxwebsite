<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugx Gaming - Login</title>
    <link rel="shortcut icon" href="../assets/web icon/lugx.jpg" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Custom CSS for styling forms and general layout -->
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <!-- Minimal Header for Auth Pages -->
    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="../assets/img/logo.png" alt="Lugx Logo"> <!-- Assuming this path is correct as per your confirmation -->
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div class="form-wrapper">
            <div class="section-header center-header">
                <h6>Login</h6>
                <h2>Sign In To Your Account</h2>
            </div>
            <div id="message-container" class="message-container"></div>
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember_me" name="remember_me">
                    <label for="remember_me">Remember Me</label>
                </div>
                <button type="submit" class="btn-primary full-width">Login</button>
                <p class="form-link">Forgot your password? <a href="forgot_password.html">Reset it here</a></p>
                <p class="form-link">Don't have an account? <a href="register.html">Register here</a></p>
            </form>
        </div>
    </div>

    <!-- Minimal Footer for Auth Pages -->
    <footer class="auth-footer">
        <div class="container">
            <p>Copyright &copy; 2048 Lugx Gaming Company. All rights reserved.</p>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
