<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Lugx Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts - Inter for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" xintegrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Custom Admin CSS - For dark theme and specific styles -->
    <link rel="stylesheet" href="../../assets/css/admin_style.css">
    <!-- Responsive Admin CSS (Added for consistency, though not strictly needed for login page) -->
    <link rel="stylesheet" href="../../assets/css/admin_responsive.css">
    <!-- APP_BASE_URL_PATH_PLACEHOLDER -->
    <script>
        window.AppBaseUrlPath = '/Lugxwebsite/public';
        console.log('AppBaseUrlPath is set to:', window.AppBaseUrlPath);
    </script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <img src="https://placehold.co/100x100/3182ce/ffffff?text=Admin" alt="Admin Logo" class="mb-3 rounded-full">
            <h2>Admin Panel Login</h2>
            <p class="text-gray-400">Please enter your login details.</p>
        </div>
        <form id="adminLoginForm">
            <input type="hidden" name="csrf_token" id="csrf_token" value=""> <!-- CSRF Token will be populated by JS -->
            <div class="mb-4">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-4 password-input-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                <span class="password-toggle" id="passwordToggle">
                    <i class="fa-solid fa-eye" style="margin-top: 36px;"></i>
                </span>
            </div>
            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" name="remember_me">
                <label class="form-check-label" for="rememberMe">Remember Me</label>
            </div>
            <div id="message" class="alert d-none" role="alert"></div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>

    <!-- Bootstrap 5 JS Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Custom Admin JavaScript -->
    <script src="../../assets/js/admin/admin_main.js"></script>
    <script src="../../assets/js/admin/admin_auth.js"></script>
    <script>
        // JavaScript for password toggle
        document.addEventListener('DOMContentLoaded', function() {
            const passwordField = document.getElementById('password');
            const passwordToggle = document.getElementById('passwordToggle');

            if (passwordToggle && passwordField) {
                passwordToggle.addEventListener('click', function() {
                    const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordField.setAttribute('type', type);
                    // Toggle the eye icon
                    this.querySelector('i').classList.toggle('fa-eye');
                    this.querySelector('i').classList.toggle('fa-eye-slash');
                });
            }
        });
    </script>
</body>
</html>
