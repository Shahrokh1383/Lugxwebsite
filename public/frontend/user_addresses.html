<!DOCTYPE html>
<html lang="en" dir="ltr"> <!-- lang set to en, dir to ltr for content -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Addresses - Lugx Gaming</title>
    <link rel="shortcut icon" href="../assets/web icon/lugx.jpg" type="image/x-icon">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Poppins (as per your :root --font-family) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/user_style.css"> <!-- User-specific styles -->
    <link rel="stylesheet" href="../assets/css/user_responsive.css"> <!-- User-specific responsive styles -->
</head>
<body>

    <!-- Header/Navbar - Replicated from index.html -->
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="logo">
                    <img src="../assets/img/logo.png" alt="Lugx Logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <!-- This li will be dynamically updated by main.js -->
                    <li id="auth-links-container"> 
                        <a href="login.html" id="auth-link" class="btn-primary">Sign In</a>
                    </li> 
                </ul>
                <div class="menu-toggle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container-fluid py-5 user-dashboard-bg flex-grow-1">
        <div class="container">
            <div class="row g-4">
                <!-- Sidebar for User Navigation -->
                <aside class="col-md-3">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4">
                            <h2 class="card-title fs-4 fw-bold text-dark-gray mb-4 border-bottom pb-3">User Dashboard</h2>
                            <nav>
                                <ul class="list-unstyled mb-0">
                                    <li class="mb-2">
                                        <a href="user_dashboard.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-tachometer-alt me-3"></i>
                                            <span>Dashboard Summary</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_profile.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-user me-3"></i>
                                            <span>My Profile</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_orders.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-shopping-bag me-3"></i>
                                            <span>My Orders</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_addresses.html" class="d-flex align-items-center p-3 rounded-3 text-primary-blue bg-light-blue active-link">
                                            <i class="fas fa-map-marker-alt me-3"></i>
                                            <span>My Addresses</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="./wishlist.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-heart me-3"></i>
                                            <span>Wishlist</span>
                                        </a>
                                    </li>
                                    <li>
                                        <!-- Logout Form for Sidebar -->
                                        <form id="logoutForm" class="logout-form">
                                            <button type="submit" class="d-flex align-items-center p-3 rounded-3 text-danger hover-bg-red-light w-100 border-0 bg-transparent text-start">
                                                <i class="fas fa-sign-out-alt me-3"></i>
                                                <span>Logout</span>
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </aside>

                <!-- Content Area for User Addresses -->
                <section class="col-md-9">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4">
                            <h1 class="card-title fs-3 fw-bold text-dark-gray mb-4">My Addresses</h1>
                            <div id="message-container" class="mb-4"></div>

                            <div class="d-flex justify-content-end mb-4">
                                <button type="button" class="btn custom-btn-primary" data-bs-toggle="modal" data-bs-target="#addressModal" id="add-address-btn">
                                    <i class="fas fa-plus me-2"></i> Add New Address
                                </button>
                            </div>

                            <div id="addresses-list" class="row row-cols-1 g-3">
                                <!-- Addresses will be loaded here by JavaScript -->
                                <div class="col">
                                    <div class="card border-0 rounded-3 shadow-sm p-4 text-center text-medium-gray">
                                        <p class="mb-0">No addresses found. Click "Add New Address" to add one.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="custom-footer text-white py-3 mt-auto shadow-inner">
        <div class="container text-center small">
            <p class="mb-0">&copy; <span id="current-year-footer"></span> Lugx Gaming. All rights reserved.</p>
        </div>
    </footer>

    <!-- Address Add/Edit Modal -->
    <div class="modal fade" id="addressModal" tabindex="-1" aria-labelledby="addressModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow-lg">
                <div class="modal-header border-bottom-0 pb-0">
                    <h5 class="modal-title fs-5 fw-bold text-dark-gray" id="addressModalLabel">Add New Address</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="address-form" class="row g-3">
                        <input type="hidden" id="address_id" name="id">
                        <div class="col-12">
                            <label for="title" class="form-label text-medium-gray">Address Title (e.g., Home, Work)</label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="e.g., My Home Address" required>
                            <div class="invalid-feedback" id="title_error"></div>
                        </div>
                        
                        <!-- ADDED: First Name Field -->
                        <div class="col-md-6">
                            <label for="first_name" class="form-label text-medium-gray">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" placeholder="John" required>
                            <div class="invalid-feedback" id="first_name_error"></div>
                        </div>
                        <!-- ADDED: Last Name Field -->
                        <div class="col-md-6">
                            <label for="last_name" class="form-label text-medium-gray">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Doe" required>
                            <div class="invalid-feedback" id="last_name_error"></div>
                        </div>

                        <div class="col-12">
                            <label for="address_line_1" class="form-label text-medium-gray">Address Line 1</label>
                            <input type="text" class="form-control" id="address_line_1" name="address" placeholder="Street address, P.O. Box, company name, c/o" required>
                            <div class="invalid-feedback" id="address_error"></div>
                        </div>
                        <!-- ADDED: Address Line 2 Field -->
                        <div class="col-12">
                            <label for="address_line_2" class="form-label text-medium-gray">Address Line 2 (Optional)</label>
                            <input type="text" class="form-control" id="address_line_2" name="address2" placeholder="Apartment, studio, or floor">
                            <div class="invalid-feedback" id="address2_error"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="city" class="form-label text-medium-gray">City</label>
                            <input type="text" class="form-control" id="city" name="city" placeholder="City" required>
                            <div class="invalid-feedback" id="city_error"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="state" class="form-label text-medium-gray">State / Province / Region</label>
                            <input type="text" class="form-control" id="state" name="state" placeholder="State" required>
                            <div class="invalid-feedback" id="state_error"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="zip_code" class="form-label text-medium-gray">Zip / Postal Code</label>
                            <input type="text" class="form-control" id="zip_code" name="postal_code" placeholder="Zip Code" required>
                            <div class="invalid-feedback" id="postal_code_error"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="country" class="form-label text-medium-gray">Country</label>
                            <input type="text" class="form-control" id="country" name="country" placeholder="Country" required>
                            <div class="invalid-feedback" id="country_error"></div>
                        </div>
                        <!-- ADDED: Phone Field -->
                        <div class="col-12">
                            <label for="phone" class="form-label text-medium-gray">Phone (Optional)</label>
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="e.g., +1234567890">
                            <div class="invalid-feedback" id="phone_error"></div>
                        </div>

                        <div class="col-12 form-check">
                            <input class="form-check-input" type="checkbox" id="is_default" name="is_default">
                            <label class="form-check-label text-medium-gray" for="is_default">
                                Set as default address
                            </label>
                        </div>
                        <div class="col-12 d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn custom-btn-primary" id="save-address-btn">Save Address</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3 JS (Bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Main JavaScript file (must be loaded first for common functions) -->
    <script src="../assets/js/main.js"></script>
    <!-- Auth JavaScript file (for login/register/logout forms) -->
    <script src="../assets/js/auth.js"></script>
    <!-- User Addresses specific JavaScript -->
    <script src="../assets/js/user_addresses.js"></script>
    <script>
        // Set current year in footer
        document.getElementById('current-year-footer').textContent = new Date().getFullYear();
    </script>
</body>
</html>
