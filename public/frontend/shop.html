<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugx Gaming - Shop</title>
    <link rel="icon" href="../assets/img/logo.png" type="image/x-icon">

    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome CSS for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/user_style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/user_responsive.css">
</head>
<body>
    <!-- Preloader -->
    <!-- (Your preloader HTML if any) -->

    <!-- Message Container (for global messages/toasts) -->
    <div id="message-container" class="message-container">
        <!-- Messages will be dynamically inserted here by main.js -->
    </div>

    <header class="shop-header">
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="logo">
                    <img src="../assets/img/logo.png" alt="Lugx Logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="./shop.html" class="active">Shop</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <!-- NEW: Shopping Cart Icon with Count -->
                    <li class="cart-icon-container">
                        <a href="./cart.html" class="cart-link">
                            <i class="fas fa-shopping-cart"></i>
                            <span id="cart-item-count" class="badge bg-danger rounded-pill">0</span>
                        </a>
                    </li>
                    <li id="auth-links-container"> 
                        <!-- This content will be dynamically updated by auth.js/main.js -->
                        <a href="./login.html" id="auth-link" class="btn-primary">Sign In</a>
                    </li> 
                </ul>
                <div class="menu-toggle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <section class="page-heading">
            <div class="container">
                <h2>Our Shop</h2>
                <div class="breadcrumb">
                    <a href="index.html">Home</a> /
                    <a href="shop.html" class="active">Our Shop</a>
                </div>
            </div>
            <!-- Search Box for Shop Page -->
            <div class="hero-content" style="margin: 0 auto;">
                <div class="search-box" style="margin-bottom: 50px; margin-top: 50px;">
                    <input type="text" id="shop-search-input" placeholder="Search games in shop...">
                    <button type="submit" id="shop-search-button">SEARCH NOW</button>
                </div>   
            </div>
        </section>

        <section class="shop-content">
            <div class="container">
                <!-- Message container for general messages (success, error, info) -->
                <div id="message-container" class="message-container" style="margin-bottom: 20px;"></div>

                <div class="shop-filters">
                    <div id="category-filter-container" style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                        <p style="text-align: center; color: var(--dark-gray);">Loading categories...</p>
                    </div>
                </div>

                <div class="shop-games-grid row" id="product-grid">
                    <div class="col-12"><p style="text-align: center; color: var(--dark-gray);">Loading products...</p></div>
                </div>

                <div class="pagination" id="pagination-pagination-container">
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>Copyright © 2048 Lugx Gaming Company. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper (این خط را اضافه کنید - باید قبل از JS های سفارشی شما باشد) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- Main JavaScript File -->
    <script src="../assets/js/main.js"></script>
    <!-- Auth JavaScript file (for login/register/logout forms and auth status) -->
    <script src="../assets/js/auth.js"></script>
    <!-- Cart JavaScript file -->
    <script src="../assets/js/cart.js"></script>
    <!-- Wishlist JavaScript file -->
    <script src="../assets/js/wishlist.js"></script>
    <!-- Product JavaScript file (for shop page logic) -->
    <script src="../assets/js/product.js"></script>
</body>
</html>
