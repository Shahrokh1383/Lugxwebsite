<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugx Gaming - Forgot Password</title>
    <link rel="icon" href="../assets/img/logo.png" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Custom CSS for styling forms and general layout -->
    <link rel="stylesheet" href="../assets/css/auth.css">

</head>
<body>

    <!-- Minimal Header for Auth Pages -->
    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="../assets/img/logo.png" alt="Lugx Logo">
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div class="form-wrapper">
            <div class="section-header center-header">
                <h6>Password Recovery</h6>
                <h2>Forgot Your Password?</h2>
            </div>
            <div id="message-container" class="message-container"></div>
            <form id="forgotPasswordForm" class="auth-form">
                <div class="form-group">
                    <label for="email">Enter your email to receive a reset link:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                <button type="submit" class="btn-primary full-width">Send Reset Link</button>
                <p class="form-link">Remembered your password? <a href="login.html">Sign In here</a></p>
            </form>
        </div>
    </div>

    <!-- Minimal Footer for Auth Pages -->
    <footer class="auth-footer">
        <div class="container">
            <p>Copyright &copy; 2048 Lugx Gaming Company. All rights reserved.</p>
        </div>
    </footer>

    <!-- ADDED: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
</body>
</html>
