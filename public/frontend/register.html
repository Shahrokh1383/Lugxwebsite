<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugx Gaming - Register</title>
    <link rel="icon" href="../assets/img/logo.png" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Custom CSS for styling forms and general layout -->
    <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

    <!-- Minimal Header for Auth Pages -->
    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="../assets/img/logo.png" alt="Lugx Logo">
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div class="form-wrapper">
            <div class="section-header center-header">
                <h6>Register</h6>
                <h2>Create Your Account</h2>
            </div>
            <div id="message-container" class="message-container"></div>
            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" class="form-control" required minlength="3" maxlength="50">
                    <div class="error-message" id="username-error"></div>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                    <div class="error-message" id="email-error"></div>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" class="form-control" required minlength="8">
                        <span class="password-toggle" onclick="togglePassword('password')">
                            <i class="far fa-eye"></i>
                        </span>
                    </div>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirm Password:</label>
                    <div class="password-container">
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                        <span class="password-toggle" onclick="togglePassword('confirm_password')">
                            <i class="far fa-eye"></i>
                        </span>
                    </div>
                    <div class="error-message" id="confirm_password-error"></div>
                </div>
                <div class="form-group">
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" class="form-control" required maxlength="50">
                    <div class="error-message" id="first_name-error"></div>
                </div>
                <div class="form-group">
                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" required maxlength="50">
                    <div class="error-message" id="last_name-error"></div>
                </div>
                <div class="form-group">
                    <label for="phone">Phone (Optional):</label>
                    <input type="text" id="phone" name="phone" class="form-control">
                    <div class="error-message" id="phone-error"></div>
                </div>
                <div class="form-group">
                    <label for="date_of_birth">Date of Birth (Optional):</label>
                    <input type="date" id="date_of_birth" name="date_of_birth" class="form-control">
                    <div class="error-message" id="date_of_birth-error"></div>
                </div>
                <div class="form-group">
                    <label for="gender">Gender (Optional):</label>
                    <select id="gender" name="gender" class="form-control">
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                    <div class="error-message" id="gender-error"></div>
                </div>
                
                <button type="submit" class="btn-primary full-width">Register</button>
                <p class="form-link">Already have an account? <a href="login.html">Sign In here</a></p>
            </form>
        </div>
    </div>

    <!-- Minimal Footer for Auth Pages -->
    <footer class="auth-footer">
        <div class="container">
            <p>Copyright &copy; 2048 Lugx Gaming Company. All rights reserved.</p>
        </div>
    </footer>

    <!-- ADDED: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        // تابع نمایش/مخفی کردن رمز عبور
        function togglePassword(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const toggleIcon = document.querySelector(`#${fieldId} + .password-toggle i`);
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
