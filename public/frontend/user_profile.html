<!DOCTYPE html>
<html lang="en" dir="ltr"> <!-- lang set to en, dir set to ltr as requested -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Lugx Gaming</title>
    <link rel="shortcut icon" href="../assets/web icon/lugx.jpg" type="image/x-icon">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Poppins (as per your :root --font-family) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/user_style.css"> <!-- User-specific styles -->
    <link rel="stylesheet" href="../assets/css/user_responsive.css"> <!-- User-specific responsive styles -->
</head>
<body>

    <!-- Header/Navbar - Replicated from index.html -->
    <header>
        <nav class="navbar">
            <div class="container">
                <a href="index.html" class="logo">
                    <img src="../assets/img/logo.png" alt="Lugx Logo">
                </a>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="shop.html">Shop</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <!-- This li will be dynamically updated by main.js -->
                    <li id="auth-links-container"> 
                        <a href="login.html" id="auth-link" class="btn-primary">Sign In</a>
                    </li> 
                </ul>
                <div class="menu-toggle">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </div>       
        </nav>
    </header>

    <!-- Main Content Area -->
    <main class="container-fluid py-5 user-dashboard-bg flex-grow-1">
        <div class="container">
            <div class="row g-4">
                <!-- Sidebar for User Navigation -->
                <aside class="col-md-3">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4">
                            <h2 class="card-title fs-4 fw-bold text-dark-gray mb-4 border-bottom pb-3">User Dashboard</h2>
                            <nav>
                                <ul class="list-unstyled mb-0">
                                    <li class="mb-2">
                                        <a href="user_dashboard.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-tachometer-alt me-3"></i>
                                            <span>Dashboard Summary</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_profile.html" class="d-flex align-items-center p-3 rounded-3 text-primary-blue bg-light-blue active-link">
                                            <i class="fas fa-user me-3"></i>
                                            <span>My Profile</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_orders.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-shopping-bag me-3"></i>
                                            <span>My Orders</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_addresses.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-map-marker-alt me-3"></i>
                                            <span>My Addresses</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="./wishlist.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-heart me-3"></i>
                                            <span>Wishlist</span>
                                        </a>
                                    </li>
                                    <li>
                                        <!-- Logout Form for Sidebar -->
                                        <form id="logoutForm" class="logout-form">
                                            <button type="submit" class="d-flex align-items-center p-3 rounded-3 text-danger hover-bg-red-light w-100 border-0 bg-transparent text-start">
                                                <i class="fas fa-sign-out-alt me-3"></i>
                                                <span>Logout</span>
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </aside>

                <!-- Content Area for User Profile -->
                <section class="col-md-9">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4">
                            <h1 class="card-title fs-3 fw-bold text-dark-gray mb-4">My Profile</h1>
                            <div id="message-container" class="mb-4"></div>

                            <!-- Profile Information Form -->
                            <h2 class="fs-4 fw-bold text-dark-gray mb-3">Personal Information</h2>
                            <form id="profile-form" class="row g-3">
                                <div class="col-md-6">
                                    <label for="first_name" class="form-label text-medium-gray">First Name</label>
                                    <input type="text" class="form-control" id="first_name" name="first_name" placeholder="Enter your first name">
                                    <div class="invalid-feedback" id="first_name_error"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="last_name" class="form-label text-medium-gray">Last Name</label>
                                    <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Enter your last name">
                                    <div class="invalid-feedback" id="last_name_error"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="email" class="form-label text-medium-gray">Email Address</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" readonly disabled>
                                    <div class="invalid-feedback" id="email_error"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label text-medium-gray">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" name="phone" placeholder="e.g., +1234567890">
                                    <div class="invalid-feedback" id="phone_error"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="date_of_birth" class="form-label text-medium-gray">Date of Birth</label>
                                    <input type="date" class="form-control" id="date_of_birth" name="date_of_birth">
                                    <div class="invalid-feedback" id="date_of_birth_error"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="gender" class="form-label text-medium-gray">Gender</label>
                                    <select class="form-select" id="gender" name="gender">
                                        <option value="">Select Gender</option>
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                    </select>
                                    <div class="invalid-feedback" id="gender_error"></div>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn custom-btn-primary" id="save-profile-btn">Save Profile</button>
                                </div>
                            </form>

                            <!-- Change Password Form -->
                            <h2 class="fs-4 fw-bold text-dark-gray mt-5 mb-3">Change Password</h2>
                            <form id="change-password-form" class="row g-3">
                                <div class="col-md-6">
                                    <label for="current_password" class="form-label text-medium-gray">Current Password</label>
                                    <input type="password" class="form-control" id="current_password" name="current_password" placeholder="Enter current password">
                                    <div class="invalid-feedback" id="current_password_error"></div>
                                </div>
                                <div class="col-md-6">
                                    <!-- Empty column for spacing on md+ screens -->
                                </div>
                                <div class="col-md-6">
                                    <label for="new_password" class="form-label text-medium-gray">New Password</label>
                                    <input type="password" class="form-control" id="new_password" name="new_password" placeholder="Enter new password">
                                    <div class="invalid-feedback" id="new_password_error"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="confirm_new_password" class="form-label text-medium-gray">Confirm New Password</label>
                                    <input type="password" class="form-control" id="confirm_new_password" name="confirm_new_password" placeholder="Confirm new password">
                                    <div class="invalid-feedback" id="confirm_new_password_error"></div>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn custom-btn-primary" id="change-password-btn">Change Password</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="custom-footer text-white py-3 mt-auto shadow-inner">
        <div class="container text-center small">
            <p class="mb-0">&copy; <span id="current-year-footer"></span> Lugx Gaming. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS (Bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Main JavaScript file (must be loaded first for common functions) -->
    <script src="../assets/js/main.js"></script>
    <!-- Auth JavaScript file (for login/register/logout forms) -->
    <script src="../assets/js/auth.js"></script>
    <!-- User Profile specific JavaScript -->
    <script src="../assets/js/user_profile.js"></script>
    <script>
        // Set current year in footer
        document.getElementById('current-year-footer').textContent = new Date().getFullYear();
    </script>
</body>
</html>
