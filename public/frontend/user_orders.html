<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Lugx Gaming</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" xintegrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <link rel="stylesheet" href="../assets/css/user_style.css">
    <link rel="stylesheet" href="../assets/css/user_responsive.css">
</head>
<body>

<!-- Header/Navbar -->
<header>
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="../assets/img/logo.png" alt="Lugx Logo">
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            <div class="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </div>
        </div>        
    </nav>
</header>

<!-- Main Content Area -->
<main class="container-fluid py-5 user-dashboard-bg flex-grow-1">
    <div class="container">
        <div class="row g-4">
            <!-- Sidebar for User Navigation -->
            <aside class="col-md-3">
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4">
                        <h2 class="card-title fs-4 fw-bold text-dark-gray mb-4 border-bottom pb-3">User Dashboard</h2>
                        <nav>
                            <ul class="list-unstyled mb-0">
                                <li class="mb-2">
                                    <a href="user_dashboard.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                        <i class="fas fa-tachometer-alt me-3"></i>
                                        <span>Dashboard Summary</span>
                                    </a>
                                </li>
                                <li class="mb-2">
                                    <a href="user_profile.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                        <i class="fas fa-user me-3"></i>
                                        <span>My Profile</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_orders.html" class="d-flex align-items-center p-3 rounded-3 text-primary-blue bg-light-blue active-link">
                                            <i class="fas fa-shopping-bag me-3"></i>
                                            <span>My Orders</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_addresses.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-map-marker-alt me-3"></i>
                                            <span>My Addresses</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_wishlist.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-heart me-3"></i>
                                            <span>Wishlist</span>
                                        </a>
                                    </li>
                                    <li class="mb-2">
                                        <a href="user_game_library.html" class="d-flex align-items-center p-3 rounded-3 text-medium-gray hover-bg-light-gray">
                                            <i class="fas fa-gamepad me-3"></i>
                                            <span>My Game Library</span>
                                        </a>
                                    </li>
                                    <li>
                                        <form id="logoutForm" class="logout-form">
                                            <button type="submit" class="d-flex align-items-center p-3 rounded-3 text-danger hover-bg-red-light w-100 border-0 bg-transparent text-start">
                                                <i class="fas fa-sign-out-alt me-3"></i>
                                                <span>Logout</span>
                                            </button>
                                        </form>
                                    </li>
                                </ul>
                            </nav>
                        </div>
                    </div>
                </aside>

                <!-- Content Area for My Orders -->
                <section class="col-md-9">
                    <div class="card shadow-lg border-0 rounded-4">
                        <div class="card-body p-4">
                            <h1 class="card-title fs-3 fw-bold text-dark-gray mb-4">My Orders</h1>
                            <div id="message-container-orders" class="mb-4"></div>
                            <div id="orders-list" class="table-responsive">
                                <!-- Orders will be loaded here by JavaScript -->
                                <p class="text-center text-medium-gray py-5">Loading orders...</p>
                            </div>
                            <div id="orders-pagination" class="d-flex justify-content-center mt-4"></div>
                            <div id="no-orders-message" class="alert alert-info text-center mt-4 d-none" role="alert">
                                You haven't placed any orders yet.
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="custom-footer text-white py-3 mt-auto shadow-inner">
        <div class="container text-center small">
            <p class="mb-0">&copy; <span id="current-year-footer"></span> Lugx Gaming. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap 5.3 JS (Bundle includes Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" xintegrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Main JavaScript file (must be loaded first for common functions) -->
    <script src="../assets/js/main.js"></script>
    <!-- Auth JavaScript file (for login/register/logout forms) -->
    <script src="../assets/js/auth.js"></script>
    <!-- User Orders specific JavaScript -->
    <script src="../assets/js/order.js"></script>
    <script>
        // Set current year in footer
        document.getElementById('current-year-footer').textContent = new Date().getFullYear();
    </script>
</body>
</html>
