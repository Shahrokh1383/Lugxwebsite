<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lugx Gaming - Reset Password</title>
    <link rel="shortcut icon" href="../assets/web icon/lugx.jpg" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Custom CSS for styling forms and general layout -->
    <link rel="stylesheet" href="../assets/css/auth.css">
    
</head>
<body>

    <!-- Minimal Header for Auth Pages -->
    <header class="auth-header">
        <div class="container">
            <a href="index.html" class="logo">
                <img src="../assets/img/logo.png" alt="Lugx Logo">
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div class="form-wrapper">
            <div class="section-header center-header">
                <h6>Password Reset</h6>
                <h2>Set Your New Password</h2>
            </div>
            <div id="message-container" class="message-container"></div>
            <form id="resetPasswordForm" class="auth-form">
                <!-- Hidden input for the reset token -->
                <input type="hidden" id="reset_token" name="token"> 

                <div class="form-group">
                    <label for="new_password">New Password:</label>
                    <div class="password-container">
                        <input type="password" id="new_password" name="new_password" class="form-control" required minlength="8">
                        <span class="password-toggle" onclick="togglePassword('new_password')">
                            <i class="far fa-eye"></i>
                        </span>
                    </div>
                    <div class="error-message" id="new_password-error"></div>
                </div>
                <div class="form-group">
                    <label for="confirm_new_password">Confirm New Password:</label>
                    <div class="password-container">
                        <input type="password" id="confirm_new_password" name="confirm_new_password" class="form-control" required>
                        <span class="password-toggle" onclick="togglePassword('confirm_new_password')">
                            <i class="far fa-eye"></i>
                        </span>
                    </div>
                    <div class="error-message" id="confirm_new_password-error"></div>
                </div>
                <button type="submit" class="btn-primary full-width">Reset Password</button>
                <p class="form-link">Remembered your password? <a href="login.html">Sign In here</a></p>
            </form>
        </div>
    </div>

    <!-- Minimal Footer for Auth Pages -->
    <footer class="auth-footer">
        <div class="container">
            <p>Copyright &copy; 2048 Lugx Gaming Company. All rights reserved.</p>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
        // تابع نمایش/مخفی کردن رمز عبور
        function togglePassword(fieldId) {
            const passwordField = document.getElementById(fieldId);
            const toggleIcon = document.querySelector(`#${fieldId} + .password-toggle i`);
            
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordField.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
