<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUGX Gaming - Sign Up</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="./assets/css/app.css">
  <link rel="stylesheet" href="./assets/css/auth.css">
</head>
<body class="auth-page">

  <a href="index.html" class="auth-back-link text-decoration-none">
    <i class="fa-solid fa-arrow-left me-1"></i> Back to Store
  </a>

  <section class="auth-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="auth-card">
            
            <div class="auth-logo-wrapper">
              <img src="./assets/images/logo.png" alt="LUGX Logo" class="auth-logo">
            </div>

            <h2 class="text-center">Create Account</h2>
            <p class="text-secondary text-center">Join LUGX and grab the best deals.</p>

            <form>
              <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="John Doe" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Email address</label>
                <input type="email" class="form-control" placeholder="you@example.com" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="At least 8 characters" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input type="password" class="form-control" placeholder="Repeat password" required>
              </div>
              <div class="mb-4 form-check">
                <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                <label class="form-check-label" for="agreeTerms">I agree to the <a href="terms.html">Terms & Conditions</a></label>
              </div>
              <button type="submit" class="btn btn-custom-red">Sign Up</button>
            </form>

            <p class="text-center mt-4 mb-0 small">Already have an account? <a href="login.html">Sign In</a></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
